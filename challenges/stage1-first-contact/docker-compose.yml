services:
  stage1-website:
    image: nginx:alpine
    container_name: blackline-stage1-website

    ports:
      - "8081:80"

    volumes:
      - ./website:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true